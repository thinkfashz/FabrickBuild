name: Install FabrickBuild CMS source

on:
  push:
    branches:
      - agent/payload-cms
    paths:
      - cms-source.tar.gz.b64

permissions:
  contents: write

jobs:
  install-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/payload-cms

      - name: Verify and extract CMS
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode cms-source.tar.gz.b64 > /tmp/fabrickbuild-cms.tar.gz
          echo "edb21c22bfeb7a50936c921a5339af5aa92e0b852c02ce9af91a338ed45fc007  /tmp/fabrickbuild-cms.tar.gz" | sha256sum --check
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github ! -name cms-source.tar.gz.b64 -exec rm -rf {} +
          tar -xzf /tmp/fabrickbuild-cms.tar.gz -C .
          rm -f cms-source.tar.gz.b64

      - name: Commit complete CMS
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "FabrickBuild Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Build complete Payload CMS and frontend"
          git push origin agent/payload-cms
